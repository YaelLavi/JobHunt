<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>המסע לעבודה הבאה — מדריך חיפוש עבודה</title>
<meta name="description" content="מדריך אישי, שלב אחר שלב, לחיפוש עבודה — מאת יעל">

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-T6FNSZSZ2K"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-T6FNSZSZ2K');
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=David+Libre:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<a class="skip-link" href="#main-content">דלגו לתוכן הראשי</a>

<div class="app" id="app">

  <!-- Mobile-only topbar -->
  <header class="topbar" id="topbar">
    <button class="menu-btn" id="menuToggle" aria-expanded="false" aria-controls="sidebar">
      <i class="ti ti-menu-2" aria-hidden="true"></i>
      <span class="sr-only">פתחו תפריט שלבים</span>
    </button>
    <span class="topbar-title">
      <i class="ti ti-compass" aria-hidden="true"></i>
      המסע לעבודה הבאה
    </span>
  </header>

  <!-- Sidebar / bottom-sheet on mobile -->
  <nav class="sidebar" id="sidebar" aria-label="שלבי המסע">

    <div class="sidebar-brand">
      <i class="ti ti-compass" aria-hidden="true"></i>
      <div>
        <div class="sidebar-brand-name">המסע לעבודה הבאה</div>
        <div class="sidebar-brand-sub">מדריך שלב אחר שלב מאת יעל</div>
      </div>
    </div>

    <div class="sidebar-prog">
      <span class="sidebar-prog-label" id="progressLabel">מבוא</span>
      <div class="sidebar-prog-track">
        <div class="sidebar-prog-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="sidebar-nav" id="sidebarGroups"></div>

    <button class="sidebar-home-btn" id="introBtn">
      <i class="ti ti-home-2" aria-hidden="true"></i>
      חזרה למבוא
    </button>
  </nav>

  <!-- Backdrop -->
  <div class="backdrop" id="sidebarOverlay" aria-hidden="true"></div>

  <!-- Main -->
  <main id="main-content" class="main" tabindex="-1">

    <!-- Progress chip — mobile only -->
    <button class="prog-chip" id="mobileProgress" aria-controls="sidebar">
      <span class="prog-chip-icon"><i class="ti ti-list-details" aria-hidden="true"></i></span>
      <span class="prog-chip-body">
        <span class="prog-chip-label" id="mobileProgressStep">מבוא</span>
        <span class="prog-chip-title" id="mobileProgressTitle"></span>
        <span class="prog-chip-bar">
          <span class="prog-chip-fill" id="mobileProgressFill"></span>
        </span>
      </span>
      <i class="ti ti-chevron-left prog-chip-arrow" aria-hidden="true"></i>
    </button>

    <div class="card" id="contentCard"></div>

    <div class="card-nav">
      <button class="btn btn-ghost" id="prevBtn">
        <i class="ti ti-arrow-right" aria-hidden="true"></i>
        לשלב הקודם
      </button>
      <button class="btn btn-solid" id="nextBtn">
        לשלב הבא
        <i class="ti ti-arrow-left" aria-hidden="true"></i>
      </button>
    </div>

  </main>

</div>

<script src="js/content.js"></script>
<script src="js/app.js"></script>
</body>
</html>
