<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>המסע לעבודה הבאה — מדריך חיפוש עבודה</title>
<meta name="description" content="מדריך אישי, שלב אחר שלב, לחיפוש עבודה — מאת יעל">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=David+Libre:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<a class="skip-link" href="#main-content">דלגו לתוכן הראשי</a>

<div class="app" id="app">

  <!-- Header (mobile only) -->
  <header class="topbar">
    <button class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="sidebar">
      <i class="ti ti-menu-2" aria-hidden="true"></i>
      <span class="sr-only">פתחו תפריט שלבים</span>
    </button>
    <div class="topbar-title">
      <i class="ti ti-compass" aria-hidden="true"></i>
      <span>המסע לעבודה הבאה</span>
    </div>
  </header>

  <!-- Sidebar / journey menu -->
  <nav class="sidebar" id="sidebar" aria-label="שלבי המסע">
    <div class="sidebar-head">
      <i class="ti ti-compass sidebar-logo" aria-hidden="true"></i>
      <div>
        <div class="sidebar-title">המסע לעבודה הבאה</div>
        <div class="sidebar-subtitle">מדריך שלב אחר שלב מאת יעל</div>
      </div>
    </div>

    <div class="sidebar-progress">
      <div class="sidebar-progress-label">
        <span id="progressLabel">שלב 1 מתוך 14</span>
      </div>
      <div class="sidebar-progress-track">
        <div class="sidebar-progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="sidebar-groups" id="sidebarGroups"></div>

    <button class="intro-btn" id="introBtn">
      <i class="ti ti-home-2" aria-hidden="true"></i>
      <span>חזרה למבוא</span>
    </button>
  </nav>

  <!-- Mobile journey timeline -->
  <nav class="timeline" id="timeline" aria-label="ציר המסע"></nav>

  <!-- Main content -->
  <main id="main-content" class="content" tabindex="-1">
    <div class="content-card" id="contentCard">
      <!-- filled by JS -->
    </div>

    <div class="content-nav">
      <button class="nav-btn nav-btn--ghost" id="prevBtn">
        <i class="ti ti-arrow-right" aria-hidden="true"></i>
        <span>לשלב הקודם</span>
      </button>
      <button class="nav-btn nav-btn--solid" id="nextBtn">
        <span>לשלב הבא</span>
        <i class="ti ti-arrow-left" aria-hidden="true"></i>
      </button>
    </div>
  </main>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>
</div>

<script src="js/content.js"></script>
<script src="js/app.js"></script>
</body>
</html>
